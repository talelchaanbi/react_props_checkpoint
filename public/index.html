<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://icons.iconarchive.com/icons/martin-berube/sport/256/Soccer-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="
ProBall Profiles: Showcasing Top FIFA Players
      "
    />
    <link rel="apple-touch-icon" href="https://icons.iconarchive.com/icons/martin-berube/sport/256/Soccer-icon.png" />


      <script src="https://cdn.tailwindcss.com"></script>
      <script>
        // Tailwind theme customization
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                brand: {
                  50: '#eef6ff',
                  100: '#d9eaff',
                  200: '#b7d6ff',
                  300: '#8dbbff',
                  400: '#5b97ff',
                  500: '#2f74ff',
                  600: '#1257e6',
                  700: '#0c42b4',
                  800: '#0c398f',
                  900: '#0d3073',
                },
              },
              keyframes: {
                fadeUp: {
                  '0%': { opacity: '0', transform: 'translateY(16px)' },
                  '100%': { opacity: '1', transform: 'translateY(0)' },
                },
                gradientX: {
                  '0%, 100%': { backgroundPosition: '0% 50%' },
                  '50%': { backgroundPosition: '100% 50%' },
                },
                float: {
                  '0%, 100%': { transform: 'translateY(0)' },
                  '50%': { transform: 'translateY(-6px)' },
                },
              },
              animation: {
                fadeUp: 'fadeUp 600ms ease-out forwards',
                gradientX: 'gradientX 8s ease infinite',
                float: 'float 6s ease-in-out infinite',
              },
            },
          },
        };
      </script>
    
    <title>
ProBall Profiles</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
